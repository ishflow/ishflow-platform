services:
  postgres:
    image: postgres:16-alpine
    container_name: ishflow-postgres
    environment:
      POSTGRES_USER: canalog
      POSTGRES_PASSWORD: canalog_dev_password
      POSTGRES_DB: canalog_dev
    ports:
      - '5432:5432'
    volumes:
      - canalog-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U canalog -d canalog_dev']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  canalog-pgdata:
